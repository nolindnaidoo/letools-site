name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Stacked pushes cancel stale runs — only the newest commit's verdict matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      # Matches pixelcoords-site and pixelactions-site: axe over every page in
      # both colour schemes, mobile viewport first. The first run of this gate
      # caught a real one — the install command overflowed into a scrollable
      # region that could not take focus, so keyboard users could not read past
      # the visible portion.
      - name: E2E + a11y (mobile first, both schemes)
        run: bun run e2e

      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
