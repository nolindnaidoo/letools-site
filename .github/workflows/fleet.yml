# Checks that span the whole LE family and therefore cannot live in any single
# extension repo: shared-config drift, and the links in all ten READMEs.
#
# Runs weekly rather than per-push because nothing here depends on this repo's
# code — it watches the other ten. Dispatchable when you have just copied a
# config change around and want to confirm it landed everywhere.
name: Fleet

on:
  schedule:
    # Mondays, a few hours after the Dependabot window so its PRs are visible.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Shared config drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      # Shallow, no history — only the working tree is compared. All sixteen:
      # the crate-only six share a set with each other, and their docs are
      # checked for paths that are not there.
      - name: Clone the sixteen tool repos
        run: |
          mkdir -p /tmp/fleet
          for r in colors-le dates-le envsync-le numbers-le paths-le \
                   regex-le scrape-le secrets-le string-le urls-le \
                   units-le i18n-le ids-le ips-le versions-le unicode-le; do
            git clone --depth 1 --quiet \
              "https://github.com/${{ github.repository_owner }}/$r.git" "/tmp/fleet/$r"
          done
          # check-doc-paths resolves `letools-site/scripts/check-fleet.ts` the
          # way every repo writes it — relative to the directory they sit in.
          ln -s "$GITHUB_WORKSPACE" /tmp/fleet/letools-site

      - name: Compare shared config
        run: bun scripts/check-fleet.ts /tmp/fleet

      # A doc is the one artefact here with no compiler and no test. Two crate
      # standards named a sibling's contract fixture for months.
      - name: Documented paths exist
        if: always()
        run: bun scripts/check-doc-paths.ts /tmp/fleet

      # The other half: a flag has a checker, prose did not. All six crate-only
      # repos shipped a README telling readers `cargo install` would not work
      # while every one of them was live on crates.io.
      - name: No doc calls a published crate unpublished
        if: always()
        run: bun scripts/check-publication-claims.ts /tmp/fleet

      # All ten READMEs told a reader to pin `<tool>-le-mcp@2.2.1` while the
      # published package was 2.3.0 — one wrong number copied nine times and
      # aged two releases, because nothing reads a version out of prose.
      - name: Quoted versions match their manifest
        if: always()
        run: bun scripts/check-quoted-versions.ts /tmp/fleet

      # Sixteen repositories built at three different times drifted into
      # sixteen different front doors: none of the ten had an Install section
      # at all, two crate pages had no License, three had no flag reference.
      # Presence only — the middle of a README is the tool's own.
      - name: Every README carries its pillars
        if: always()
        run: bun scripts/check-readme-pillars.ts /tmp/fleet

  readme-links:
    name: README links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      # Clone rather than fetch the raw README: these files contain relative
      # links (AGENTS.md, CHANGELOG.md, src/assets/images/*), and a README
      # sitting alone in a temp directory reports every one of them as broken.
      # With the repo around it, those links are checked for real.
      - name: Clone the ten extension repos
        run: |
          mkdir -p /tmp/fleet
          for r in colors-le dates-le envsync-le numbers-le paths-le \
                   regex-le scrape-le secrets-le string-le urls-le; do
            git clone --depth 1 --quiet \
              "https://github.com/${{ github.repository_owner }}/$r.git" "/tmp/fleet/$r"
          done

      # These READMEs are also the Marketplace listing bodies, so a dead link
      # here is a dead link on a public product page.
      #
      # open-vsx.org is excluded here on purpose: it is a single-page app that
      # answers 200 for extensions that do not exist, so a status-code checker
      # cannot judge it. The next step checks those against the API instead.
      # linkedin.com answers 999 to non-browser clients and is never broken.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,301,302
            --exclude open-vsx\.org
            --exclude linkedin\.com
            /tmp/fleet/*/README.md
          fail: true

      - name: Open VSX links (API, not status code)
        run: bun scripts/check-openvsx-links.ts /tmp/fleet
