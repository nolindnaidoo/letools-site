# Security updates only. `open-pull-requests-limit: 0` turns version updates
# off for an ecosystem and leaves security updates on. Those are raised from
# the repository's Dependabot alerts, not from the schedule, which is here
# because the schema requires it. Everything else moves by hand, on purpose.
#
# The ecosystem is "bun", not "npm": the npm updater edits package.json
# without regenerating bun.lock, so its PRs can never pass the CI
# frozen-lockfile gate. The bun updater maintains the lockfile.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
